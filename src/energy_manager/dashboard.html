<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Energy dashboard</title>
<script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
<style>body{font:16px system-ui;max-width:1000px;margin:2rem auto;padding:0 1rem;background:#f5f7fa;color:#172033}header,.cards{display:flex;gap:1rem;flex-wrap:wrap}.card{background:white;padding:1rem 1.5rem;border-radius:12px;box-shadow:0 2px 12px #15294a12;min-width:160px}.muted{color:#53627a}.chart{background:white;border-radius:12px;margin-top:1rem}</style></head>
<body><h1>Smart Energy Management</h1><p class="muted">Analytics for imported readings or explicitly simulated data. No physical meter is connected.</p>
<section class="cards"><div class="card"><small>Energy</small><h2 id="energy">—</h2></div><div class="card"><small>Estimated cost</small><h2 id="cost">—</h2></div><div class="card"><small>Peak power</small><h2 id="peak">—</h2></div><div class="card"><small>Anomalies</small><h2 id="anomalies">—</h2></div></section><div id="chart" class="chart"></div>
<script>fetch('/analytics').then(r=>r.json()).then(d=>{document.querySelector('#energy').textContent=d.energy_kwh.toFixed(3)+' kWh';document.querySelector('#cost').textContent='€'+d.cost_eur.toFixed(2);document.querySelector('#peak').textContent=d.peak_power_w.toFixed(0)+' W';document.querySelector('#anomalies').textContent=d.anomaly_count;const t=Object.keys(d.hourly_kwh),v=Object.values(d.hourly_kwh);Plotly.newPlot('chart',[{x:t,y:v,type:'scatter',mode:'lines+markers',name:'Energy'}],{title:'Hourly energy consumption',xaxis:{title:'UTC time'},yaxis:{title:'kWh'},margin:{t:50}})}).catch(()=>document.body.insertAdjacentHTML('beforeend','<p>Analytics unavailable. Start the API and import readings.</p>'));</script></body></html>
