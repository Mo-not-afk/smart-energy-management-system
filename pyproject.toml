[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "smart-energy-management-system"
version = "0.1.0"
description = "Meter data validation, tariff costing, anomaly detection, and analytics"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26,<3", "pandas>=2.2,<4", "fastapi>=0.115,<1", "sqlalchemy>=2.0,<3", "uvicorn>=0.30,<1", "plotly>=5.24,<7"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx>=0.27,<1"]

[project.scripts]
energy = "energy_manager.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
[tool.setuptools.package-data]
energy_manager = ["dashboard.html"]
